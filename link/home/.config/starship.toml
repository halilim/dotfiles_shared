# https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

# cSpell:ignore localip shlvl
format = """
$username\
$hostname\
$localip\
$shlvl\
$directory\
$git_branch\
$git_commit\
$git_state\
$git_metrics\
$git_status\
$cmd_duration\
$jobs\
$character"""

[directory]
  fish_style_pwd_dir_length = 1

[git_metrics]
  disabled = false
